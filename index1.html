<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente - DESDELALINEA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        /* Efecto de partículas de fondo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 40% 90%, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }
        
        .logo-container {
            margin-bottom: 40px;
            animation: float 3s ease-in-out infinite;
        }
        
        .logo {
            max-width: 300px;
            max-height: 300px;
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }
        
        .text-container {
            margin-bottom: 50px;
        }
        
        .proximamente {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(45deg, #fff, #aaa, #fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        .subtext {
            font-size: 1.5rem;
            opacity: 0.8;
            max-width: 600px;
            line-height: 1.6;
        }
        
        .btn-inicio {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            border: none;
            cursor: pointer;
        }
        
        .btn-inicio:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
            background: linear-gradient(45deg, #ff5252, #ff7b7b);
        }
        
        .btn-inicio:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(255, 107, 107, 0.4);
        }
        
        /* Animaciones */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff6b6b; }
            to { text-shadow: 0 0 15px #fff, 0 0 25px #fff, 0 0 35px #ff6b6b, 0 0 45px #ff6b6b; }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .proximamente {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }
            
            .subtext {
                font-size: 1.2rem;
            }
            
            .logo {
                max-width: 200px;
            }
            
            .btn-inicio {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .proximamente {
                font-size: 2rem;
                letter-spacing: 2px;
            }
            
            .subtext {
                font-size: 1rem;
            }
            
            .logo {
                max-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="img/DESDELALINEA LOGO.png" alt="DESDELALINEA" class="logo">
    </div>
    
    <div class="text-container">
        <h1 class="proximamente">Próximamente</h1>
        <p class="subtext">Estamos trabajando en algo increíble para ti. Muy pronto tendrás acceso a todo el contenido de DESDELALINEA.</p>
    </div>
    
    <button class="btn-inicio" onclick="irAInicio()">
        <i class="fas fa-home"></i> Inicio
    </button>

    <script>
        function irAInicio() {
            // Redirigir a la página principal
            window.location.href = "index.html";
        }
        
        // Efecto de escritura para el subtítulo (opcional)
        document.addEventListener('DOMContentLoaded', function() {
            const subtext = document.querySelector('.subtext');
            const originalText = subtext.textContent;
            subtext.textContent = '';
            
            let i = 0;
            function typeWriter() {
                if (i < originalText.length) {
                    subtext.textContent += originalText.charAt(i);
                    i++;
                    setTimeout(typeWriter, 50);
                }
            }
            
            // Iniciar efecto de escritura después de 1 segundo
            setTimeout(typeWriter, 1000);
        });
    </script>
</body>
</html>
